[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "worldbuilder-by-aetos"
version = "0.1.0"
description = "A deterministic planet generator for Evennia games that already have a world."
readme = "README.md"
requires-python = ">=3.10"
# No license field yet: the repository has no LICENSE, and which one it carries is
# not a decision this file should make. Evennia and the maritime contrib are both
# BSD 3-Clause, which is the obvious match when somebody chooses.
# None today. The Mark 1 generator is standard library only, which is what lets it be
# tested without an Evennia install.
#
# This changes in Mark 2. The generator core moves to Rust and ships as a prebuilt wheel,
# and Worldbuilder does not target Evennia's vendored contrib tree - so the zero-dependency
# argument no longer applies. Two limits survive it: nothing may enter the engine that breaks
# native/WASM bit-equality, and nothing on the Python side may pin Django or Twisted, because
# we install into somebody else's Evennia virtualenv. See
# docs/design/2026-09-02-mark-2-world-studio.md, section 4.3.
dependencies = []

# Reference package only. The engine crate ships its own distribution now
# (crates/worldbuilder-engine/pyproject.toml: name "worldbuilder-engine", maturin
# backend), so `pip install -e .` here and `maturin develop` there no longer target the
# same dist-info and evict each other's files from it. See tests/test_installation.py,
# which is the regression test for that collision.
[tool.setuptools.packages.find]
include = ["worldbuilder*"]
exclude = ["worldbuilder_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
