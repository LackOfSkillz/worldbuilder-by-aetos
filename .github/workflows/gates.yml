# THROWAWAY BRANCH (slice CI, task 2). One deliberate breakage, one red.
#
# fingerprintInputs() in viewer/scripts/build-wasm.mjs now skips src/wasm.rs. The staleness
# guard therefore cannot see the one file whose drift made the shipped artifact stale in the
# first place -- an artifact built before a wasm.rs edit would still be called current.
#
# `npm run build:wasm:stale-self-test` is the proof that the guard can refuse. With the
# fingerprint blinded, its mutation (one appended line in wasm.rs, in a temp copy) no longer
# changes the digest, and the self-test must fail rather than congratulate itself.
#
# This is the failure a check that COMPARES AGAINST ITS OWN OUTPUT produces, and this repo
# has shipped one of those before.

name: gates

on:
  push:
  workflow_dispatch:

env:
  RUST_VERSION: "1.98.0"

jobs:
  stale-self-test:
    name: staleness self-test with the fingerprint blinded (MUST FAIL)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
      - name: Can the staleness fingerprint refuse a tree that moved?
        shell: bash
        working-directory: viewer
        run: npm run build:wasm:stale-self-test
