# THROWAWAY BRANCH (slice CI, task 2). Two things the batched branches could not show.
#
# 1. THE DETERMINISM GUARD, ALONE. On prove/determinism-constant-provenance the changed
#    constant failed `--lib` and `cargo test` never reached tests/no_std_math.rs -- targets
#    are run in order and it stops at the first failing one. So the guard's own red was
#    never actually seen. Here the ONLY change is a `f64::sqrt(` in src/lib.rs.
#
# 2. THE SILENT SKIP, IN ITS HISTORICAL FORM. On prove/python-skips-when-unguarded the
#    unguarded job ran `pytest tests/test_conformance.py` alone and exited 5 -- "no tests
#    collected" -- which is red for a reason that was never the bug. The real gate runs
#    `pytest tests/`, where the other thirteen files collect and pass. THIS JOB IS EXPECTED
#    TO BE GREEN with the engine absent and no guard set, and that green is the bug: 390
#    conformance comparisons skipped, exit 0, nothing compared.

name: gates

on:
  push:
  workflow_dispatch:

env:
  RUST_VERSION: "1.98.0"

jobs:
  determinism:
    name: determinism guard, nothing else broken (MUST FAIL)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
      - name: cargo test --no-default-features
        shell: bash
        run: cargo test -p worldbuilder-engine --no-default-features

  silent-skip:
    name: pytest tests/ with no engine and no guard (this green is the bug)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - shell: bash
        run: python -m pip install --upgrade pip pytest
      - name: The engine is genuinely absent
        shell: bash
        run: |
          python -c "
          import importlib.util, sys
          print('worldbuilder_engine spec:', importlib.util.find_spec('worldbuilder_engine'))
          sys.exit(1 if importlib.util.find_spec('worldbuilder_engine') else 0)
          "
      - name: pytest tests/ -- the historical configuration, expected GREEN
        shell: bash
        run: python -m pytest tests/ -rs
