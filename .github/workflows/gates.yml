# Every gate this project has built, run on every push.
#
# The argument for this file is in docs/superpowers/plans/2026-09-04-slice-ci.md, and it is
# not "CI is good practice". Three specific things went wrong here and each survived several
# commits BECAUSE nothing ran the check that would have caught it: a conformance suite that
# skipped silently and reported green while comparing nothing; a shipped `.wasm` that was
# several commits stale and passing parity; and a provenance guard that was itself
# unreproducible from git and failed on every machine but its author's. A gate nobody runs
# is a gate that can rot without anyone noticing.
#
# Design notes that are load-bearing, not decoration:
#
#   * EVERYTHING RUNS ON WINDOWS, AND THE TOOLCHAIN IS PINNED TO 1.98.0. This is not a
#     preference. `viewer/public/wasm/MANIFEST.txt` records
#         toolchain: rustc 1.98.0 88d9e12ae178... x86_64-pc-windows-msvc
#     and `checkFreshness()` in viewer/scripts/build-wasm.mjs folds that exact string --
#     release, commit hash AND HOST TRIPLE -- into the source fingerprint. A Linux runner
#     computes a different fingerprint from byte-identical source, so `npm run check:wasm`
#     would report STALE ARTIFACT on every run, and the parity harness -- which refuses to
#     report parity against a stale artifact -- would refuse with it. The provenance gate is
#     satisfiable only on the host family that built the artifact. That is a property of the
#     gate as designed; this slice runs the gates, it does not change them.
#     Pinning the release matters for the same reason: `rustup default stable` would move off
#     1.98.0 the day upstream ships 1.99 and turn provenance red for a reason that has
#     nothing to do with the artifact.
#
#     The engine matrix could in principle run on Linux, but `--features python` cannot:
#     pyo3's `extension-module` deliberately does not link libpython on Unix, so the test
#     binary that links the rlib fails to resolve `Py_*`. Windows links pythonXX.lib and the
#     tests build. Two of the five configurations are Windows-only in practice, and the
#     recorded baselines (409/0/5 and 439/0/5) were taken there, so the whole matrix stays on
#     the host the baselines came from.
#
#   * NOTHING IS CACHED. Deliberately. Every failure this workflow exists to catch is a
#     stale-artifact failure -- a `target/` or a `.wasm` that no longer matches its source.
#     A cache keyed on anything less than the full fingerprint would reproduce that exact
#     class of bug INSIDE the thing built to detect it, and the first time it did the symptom
#     would be a green run. A clean checkout every time is the only cache policy that cannot
#     lie. The cost is recompiling two pinned dependencies (blake2, libm) and one small crate
#     per job. If build time ever becomes the binding constraint, the cache key must include
#     the same 28-input source fingerprint MANIFEST.txt records, not `Cargo.lock` alone.
#
#   * NO ARTIFACT IS REBUILT BEFORE IT IS CHECKED. The provenance job checks the COMMITTED
#     `.wasm` against the source in the same commit. Building it first would make the gate
#     tautological -- it would prove the runner can compile, not that what is committed
#     matches what is committed alongside it.
#
# NOT COVERED HERE, and Task 3 must say so out loud rather than let a green badge imply
# otherwise: the viewer's browser checks -- eleven checks and seven `?fault=` values -- still
# need a browser and a person.

name: gates

# `push` on every branch, and nothing else. `pull_request` is deliberately absent: this is a
# private repository, Windows runners bill at 2x, and a branch pushed here and then opened as
# a PR would run the whole matrix twice for the same commit. Every commit that reaches the
# remote is still gated. Add `pull_request` if this ever takes contributions from forks, whose
# commits never reach a branch here.
on:
  push:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The toolchain MANIFEST.txt was fingerprinted with. Changing this without rebuilding the
  # artifact turns the provenance gate red, which is the gate working.
  RUST_VERSION: "1.98.0"
  # The local .venv is Python 3.11.0. The conformance suite's ULP bounds are measured against
  # a platform libm, so the interpreter is pinned rather than floating.
  PYTHON_VERSION: "3.11"
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------------------------------
  # The engine suite in all five feature configurations, which is also where the determinism
  # guard (tests/no_std_math.rs) runs -- it scans all of src/ and fails on a `f64::` form, a
  # `mul_add`, or an unmarked numeric cast. It runs five times because it is a test like any
  # other; that costs nothing, and the alternative is a sixth job that could drift out of step
  # with the suite it lives in.
  #
  # Baselines: 440 passed / 0 failed / 5 ignored under no-default-features and default;
  # 442/0/5 under python; 470/0/5 under wasm; 472/0/5 under python+wasm. These ARE asserted,
  # by a second step that
  # reads `cargo test -- --list` -- not by grepping `test result:`, which is how a suite that
  # ran nothing gets called green. See the step's own comment.
  # ---------------------------------------------------------------------------------------
  engine:
    name: engine (${{ matrix.name }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # `expect` is the number of tests that must RUN in that configuration, and
          # `expect_ignored` the number that must be marked ignored. The wasm configurations
          # compile tests/wasm_exports.rs, which is 35 tests the other three never see.
          #
          # 2026-09-04, slice 5a Task 2 review fix round: these moved 431/433/461/463 ->
          # 432/434/462/464 when src/erosion.rs gained one test
          # (`a_root_is_held_at_its_old_height_rather_than_uplifted`, pinning the root policy
          # the review found unguarded -- finding 3) with no change to shipped solver
          # behaviour. The `python` rows stay TWO HIGHER than their non-python neighbours
          # (434 and 464) for the pre-existing reason -- source_fingerprint() and
          # source_fingerprint_inputs() are PyO3 exports whose binding tests only compile
          # with that feature -- unchanged by this task.
          #
          # 2026-09-05, slice 5a Task 3: 434/434/436/464/466 -> 439/439/441/469/471 when
          # `erosion.rs` gained `erode_to_convergence`/`ErosionRun` and five new tests
          # (determinism, threshold-monotonicity, converged-is-a-fixed-point, cap-reached-is-
          # reported, no-NaN-or-infinity) -- see task-3-report.md. `expect_ignored` stays 5;
          # this task added no `#[ignore]`d test (the multi-resolution sweep is
          # `src/bin/erosion_convergence_sweep.rs`, a `[[bin]]` outside the test harness
          # entirely, per the task-3 brief's "keep CI fast" instruction, so it contributes 0
          # tests to every configuration's count here).
          #
          # 2026-09-05, slice 5a Task 4 (the thermal-erosion slope cap): 440/440/442/470/472
          # -> 453/453/455/483/485. Task 4 added thirteen tests to `erosion.rs`: the slope-cap
          # constant pin, the §14.1 pathology demonstration (a low-drainage-area node grows
          # past the cap without correction), seven covering `cap_slopes` itself (binds every
          # edge, idempotent, never raises a node, deterministic, finite, does not launder a
          # NaN), the end-to-end `erode_to_convergence_output_never_exceeds_the_slope_cap`,
          # and four more once the coordinator asked for `ClampStats` instrumentation so a
          # reader could see whether the cap actually fired rather than inferring it from an
          # unchanged iteration count (`slope_cap_clamped_count_counts_exactly_the_changed_bit_patterns`,
          # `erode_to_convergence_with_clamp_counts_agrees_with_the_plain_wrapper`,
          # `erode_to_convergence_clamps_nothing_at_this_crates_default_test_constants`,
          # `erode_to_convergence_with_clamp_counts_is_nonzero_under_the_pathology`).
          # `expect_ignored` stays 5; no `#[ignore]`d test was added. Re-derived on this host
          # by `cargo test -p worldbuilder-engine <cfg> -- --list`, counting `: test$` lines
          # and subtracting the 5 ignored (from the same command with `--ignored` added):
          # 453/453/455/483/485.
          #
          # 2026-09-05, slice 5a Task 5 review fix (the `wb_erosion_run` refusal tests):
          # 453/453/455/483/485 -> 453/453/455/488/490. `tests/wasm_exports.rs` gained five
          # tests for the new export's parameter validation (the negative-`erodibility_per_yr`
          # refusal that closes the review's reachable abort, the other numeric-domain
          # refusals, the handle and buffer refusals, and one happy-path check) -- 30 -> 35
          # tests, so only the two wasm-feature rows move. `expect_ignored` stays 5.
          # Re-derived by running the gate's own two commands per config
          # (`cargo test -p worldbuilder-engine <cfg> -- --list` and the same with
          # `--ignored`) through `assert_counts.py cargo-list` itself, not by counting lines
          # by hand -- the prior revision of this pin block was wrong precisely because it
          # counted the LISTED total and never subtracted the ignored five.
          #
          # 2026-09-05, whole-branch review fix round (the HIGH, second abort band):
          # 453/453/455/488/490 -> 454/454/456/490/492. `stream.rs` gained one test,
          # `build_refuses_an_infinite_or_nan_area`, pinning the fixed area check (an
          # infinite `radius_m` overflowed `4*pi*r^2` to `+inf`, which the OLD `> 0.0` check
          # admitted) -- +1 across all five configurations, since `stream.rs` compiles
          # unconditionally. `tests/wasm_exports.rs` went 35 -> 36, +1 net: this round first
          # added `a_world_with_an_overflowing_radius_refuses_erosion_rather_than_aborting`,
          # then discovered `WB_MAX_WORLD_RADIUS_M` (added in the same round to also close an
          # unrelated `i64`-overflow panic in `noise.rs`, reachable through the identical
          # huge-radius door, that a normal debug `cargo test` run would otherwise hit before
          # ever reaching the area-overflow bug) made that test's premise false -- the world
          # no longer builds at that radius at all -- so it was deleted and replaced with
          # `a_radius_that_would_overflow_downstream_arithmetic_is_refused_at_world_creation`,
          # net +1 rather than net zero. The two wasm rows therefore move by +2 (the shared
          # `stream.rs` test plus this one), the other three by +1. Re-derived the same way
          # as every prior entry in this block: the gate's own two `--list` commands per
          # config, through `assert_counts.py cargo-list` itself, not by hand arithmetic --
          # which is what caught the wasm_exports.rs miscount above before it reached this
          # file: an early draft of this comment claimed net zero on that file from arithmetic
          # alone, and the actual `--list` run (36, not 35) disagreed.
          #
          # 2026-09-05, slice 5b Task 1 (lake basin filling): 454/454/456/490/492 ->
          # 465/465/467/501/503. `src/water.rs` is new -- `basins_of` (the downhill-forest
          # partition Task 3 and Task 4 also need), `symmetric_adjacency`, and
          # `fill_lakes`/`fill_basins` (the spill formula, `min` over boundary edges of `max`
          # of the two endpoints) -- with eleven tests: two fixture sanity checks, basin
          # partitioning, the reverse-only-edge case `symmetric_adjacency` exists for (plus
          # a demonstration that omitting it silently mis-fills a lake), the spill-formula
          # test built specifically to fail if the inner `max` becomes a `min` (verified by
          # actually making that mutation and watching it fail, then reverting it), the
          # basin-with-no-rim panic, bit-identical determinism across two runs, every lake's
          # level within its legal range over a real graph (not a sample), full node coverage
          # of the basin partition, and the guard against regenerating neighbours for a
          # non-Spiral graph. `water` carries no feature gate (same precedent as `stream.rs`),
          # so all five rows move by +11 uniformly. `expect_ignored` stays 5; no `#[ignore]`d
          # test was added. This also folds in a correction to `wasm_exports.rs`'s count: the
          # README's table had carried a stale 35 there since the prior round even though that
          # round's own prose already said 36; re-deriving both files together here confirms
          # 36 is what the wasm rows actually run, independent of this task. Re-derived by
          # `cargo test -p worldbuilder-engine <cfg> -- --list` (and `--ignored`) per
          # configuration, through `assert_counts.py cargo-list` itself.
          #
          # 2026-09-05, slice 5b Task 1 review fix round: 465/465/467/501/503 ->
          # 469/469/471/505/507. Two tests added to `stream.rs`
          # (`set_lake_level_m_moves_only_the_named_lakes_level`,
          # `set_lake_level_m_reports_false_for_a_node_with_no_lake`, pinning the new
          # `StreamGraph::set_lake_level_m` the review's MEDIUM finding asked for -- the
          # computed levels reaching `Lake::level_m` itself, not just a parallel `WaterFill`)
          # and two to `water.rs` (`apply_levels_writes_the_filled_value_onto_the_graphs_own_
          # lake_table`, `fill_basins_and_apply_moves_the_graphs_own_lake_levels`, exercising
          # the new `apply_levels`/`fill_basins_and_apply`). Both files compile
          # unconditionally, so all five rows move by +4 uniformly. `expect_ignored` stays 5;
          # no `#[ignore]`d test was added. Re-derived by `cargo test -p worldbuilder-engine
          # <cfg> -- --list` (and `--ignored`) per configuration, cross-checked through
          # `assert_counts.py cargo-list` itself, which reported `count OK` at all five.
          #
          # 2026-09-05, slice 5b Task 2 (the lake super-graph and its overflow edges):
          # 469/469/471/505/507 -> 485/485/487/521/523. Fourteen tests added to `water.rs`
          # (the ordering-disagreement fixture and its property/mutation-regression tests,
          # the write-back and terminal-lake tests, the cycle-detection-and-tie-break tests,
          # the real-graph property suite, and a documentation-anchor test) and two to
          # `stream.rs` (`set_lake_outflow_lake_moves_only_the_named_lakes_outflow`,
          # `set_lake_outflow_lake_reports_false_for_a_node_with_no_lake`, pinning the new
          # `StreamGraph::set_lake_outflow_lake` write-back, the mirror of Task 1's
          # `set_lake_level_m`). Both files compile unconditionally, so all five rows move by
          # +16 uniformly. `expect_ignored` stays 5; no `#[ignore]`d test was added.
          # Re-derived by `cargo test -p worldbuilder-engine <cfg> -- --list` (and
          # `--ignored`) per configuration, cross-checked through `assert_counts.py
          # cargo-list` itself, which reported `count OK` at all five.
          #
          # 2026-09-05, Task 2 review fix round: 485/485/487/521/523 -> 492/492/494/528/530.
          # Merge replaces the reviewed-and-rejected `break_cycles` (a tied plateau is one
          # body of water, not a tie to break); five tests added to `water.rs`
          # (`merge_fixture_has_the_two_tied_roots_this_test_relies_on`,
          # `a_tied_plateau_is_merged_into_one_body_at_its_true_level`,
          # `merge_leaves_an_untied_lakes_level_untouched`,
          # `touching_lakes_fixture_is_a_closed_system_and_merge_refuses_it`,
          # `two_candidate_ordering_fixture_has_the_roots_this_test_relies_on`, net of
          # deleting the review's Finding 8 "cannot fail" test) and two to `streamfmt.rs`
          # (`refuses_an_outflow_lake_naming_a_node_that_is_not_a_lake_root`,
          # `a_resolved_graph_round_trips_its_outflow_lake_values`, pinning Finding 1's
          # `outflow_lake`-is-a-node-id fix). Both files compile unconditionally, so all five
          # rows move by +7 uniformly. `expect_ignored` stays 5. Re-derived the same way,
          # cross-checked through `assert_counts.py cargo-list` itself.
          #
          # 2026-09-05, second Task 2 fix round: 492/492/494/528/530 -> 494/494/496/530/532.
          # `merge_tied_plateaus` generalised from cycles to arbitrary ties (Finding 4: a tie
          # that drains onward in a chain is one body too, not only a mutual cycle) and gained
          # a pass-count termination guard (Finding 2: the union-find bound was proven but
          # unenforced). Two tests added to `water.rs`
          # (`chained_merge_fixture_has_the_three_roots_this_test_relies_on`,
          # `a_chained_merge_carries_the_first_passs_full_membership_into_the_second`) pin the
          # regression both findings share: a merge needing a second pass, verified by
          # mutation to fail when the first pass's accumulated membership is dropped. All five
          # rows move by +2 uniformly. `expect_ignored` stays 5.
          #
          # 2026-09-05, slice 5b Task 3 (pond/lake classification by drainage area):
          # 494/494/496/530/532 -> 499/499/501/535/537. `water.rs` gained `classify_lake_kinds`
          # (reclassifies every `Lake` row by its physical BODY's combined drainage area,
          # since a merged plateau's own pre-merge `drainage_area_m2` under-counts a body
          # Task 2 folded from several roots) and `lake_body_drainage_totals_m2` (the
          # measurement accessor `pond_threshold_survey.rs` -- a `[[bin]]`, so it contributes
          # 0 tests here -- uses to report the calibration distribution). `stream.rs` gained
          # `StreamGraph::set_lake_kind`, the write-back mirroring `set_lake_level_m`/
          # `set_lake_outflow_lake`. Five tests added to `water.rs`
          # (`a_lake_whose_drainage_area_equals_the_threshold_is_a_pond`,
          # `a_lake_whose_drainage_area_is_strictly_over_the_threshold_is_not_a_pond`,
          # `classify_lake_kinds_overwrites_the_builders_own_initial_guess`,
          # `classify_lake_kinds_is_deterministic_across_two_runs`,
          # `a_merged_bodys_kind_is_decided_by_its_combined_drainage_area_not_either_roots_own`).
          # The boundary test was verified by mutation (`<=` to `<` in
          # `classify_lake_kinds`) and is a single-assertion test so it cannot be shadowed by
          # a sibling, per this slice's own recurring finding; see task-3-report.md. Both
          # files compile unconditionally, so all five rows move by +5 uniformly.
          # `expect_ignored` stays 5; no `#[ignore]`d test was added. Re-derived by
          # `cargo test -p worldbuilder-engine <cfg> -- --list` (and `--ignored`) per
          # configuration.
          #
          # 2026-09-05, Task 3 owner-decision fix round: 499/499/501/535/537 ->
          # 500/500/502/536/538. Owner decision moved the pond/lake split from drainage area
          # to surface area (task-3-report.md's addendum has the measurement that drove it:
          # only 17-24% bottom-decile overlap between the two quantities, over the same
          # bodies). `BuildParams::pond_max_drainage_area_m2` renamed to
          # `pond_max_surface_area_m2` (still required, no `Default`); `classify_lake_kinds`
          # now takes `&Basins` and sums each body's members at or below its own filled
          # `level_m`, not `drainage_area_m2`; `lake_body_surface_areas_m2` added alongside
          # the unchanged `lake_body_drainage_totals_m2` (kept -- catchment is still the
          # right quantity for flow, flooding and foraging). Three `water.rs` tests renamed
          # to match (`a_lake_whose_surface_area_equals_the_threshold_is_a_pond`,
          # `a_lake_whose_surface_area_is_strictly_over_the_threshold_is_not_a_pond`,
          # `a_merged_bodys_kind_is_decided_by_its_combined_surface_area_not_either_roots_own`,
          # each re-derived against the new quantity, not merely relabelled) and one test
          # added (`drainage_and_surface_body_totals_agree_on_how_many_bodies_there_are`,
          # pinning that both accessors still fold the same merge groups into the same body
          # count). The boundary test was re-verified by the same mutation
          # (`classify_lake_kinds`'s `<=` to `<`) on the new quantity and is still a
          # single-assertion test. Both files compile unconditionally, so all five rows move
          # by +1 uniformly. `expect_ignored` stays 5. Re-derived the same way, cross-checked
          # through `assert_counts.py cargo-list` itself.
          #
          # 2026-09-05, Task 4 (the water manifest): 500/500/502/536/538 -> 506/506/508/542/544.
          # `water.rs` gained the manifest itself (`WaterManifest`, `Body`, `BodyKind`,
          # `Extent`, `River`, `water_manifest`, `water_manifest_from_graph`) and six
          # unconditionally-compiled tests (`water_manifest_is_bit_identical_across_two_runs`,
          # `every_physical_body_appears_exactly_once`,
          # `every_boundary_root_is_an_ocean_body_at_sea_level`, `no_body_is_two_kinds_at_once`,
          # `the_river_arm_is_expressible_and_stays_empty`,
          # `a_pond_appears_when_a_hand_built_fixture_makes_one`) -- no new `#[cfg]`, so all
          # five rows move by +6 uniformly and `expect_ignored` stays 5 (no `#[ignore]`d test
          # was added). The pond test is the sharpest of the six -- its own root cause is a
          # hand-built fixture, since no `Spiral`-sampled graph this generator produces is
          # small enough to make a real one (task-3-report.md's own finding: smallest real
          # body 7.9e8 m^2 against a 1.0e5 m^2 threshold) -- and it was verified by mutation
          # (dropping the `height_m(member) <= lake.level_m` filter in `lake_body_extents`)
          # rather than merely reasoned about; the mutation moved the pond's own extent to
          # include its land neighbour and only the extent assertion failed, not the `kind`
          # assertion beside it, so it is not shadowed by a sibling. Re-derived by `cargo test
          # -p worldbuilder-engine <cfg> -- --list` (and `--ignored`) per configuration,
          # cross-checked through `assert_counts.py cargo-list` itself.
          #
          # 2026-09-05, Task 1 (relief-amplitude parameter block): 506/506/508/542/544 ->
          # 508/508/510/544/546. `detail.rs` gained `ReliefParams` and `surface.rs` gained two
          # unconditionally-compiled tests
          # (`relief_none_matches_relief_some_canonical_bit_for_bit`,
          # `a_one_ulp_relief_perturbation_moves_the_answer`) -- no new `#[cfg]` and no
          # `#[ignore]`, so all five rows move by +2 uniformly and `expect_ignored` stays 5.
          # `relief_none_matches_relief_some_canonical_bit_for_bit` is the task's whole claim
          # (a `Surface` built with `relief: None` and one built with
          # `relief: Some(ReliefParams::canonical())` must be bit-identical over a 2,701-point
          # lat/lon grid at two resolutions); `a_one_ulp_relief_perturbation_moves_the_answer`
          # is its own, separate assertion proving that claim is falsifiable, so neither test
          # shadows the other. The bit-identity test was also verified red: task-1-report.md
          # records perturbing `Detail::new`'s `None` resolution by one ULP of `mountain_m`
          # (leaving `ReliefParams::canonical()` itself untouched) and rerunning it, which
          # failed at the first diverging grid point; reverting turned it green again. Re-
          # derived by `cargo test -p worldbuilder-engine <cfg> -- --list` (and `--ignored`)
          # per configuration, cross-checked through `assert_counts.py cargo-list` itself.
          #
          # 2026-09-05, Task 4 review-fix round: 508/508/510/544/546 -> 513/513/515/549/551.
          # Two blocking findings against the water manifest (task-4-review.md). (1) The sea
          # was enumerated as one `Body` per boundary root -- 86%/81% of all bodies at
          # n=30,000/100,000, 96% of those boxes mutually overlapping, over a third of real
          # lakes shadowed by at least one -- which inverted §13.2's own "mapping of named
          # waters, plus a fallback for the unnamed" architecture. `BodyKind::Ocean` and the
          # mouth loop in `water_manifest` are gone; the sea is exactly
          # `WaterManifest::sea_level_m` and nothing else. `every_boundary_root_is_an_ocean_
          # body_at_sea_level` and `no_body_is_two_kinds_at_once` are renamed
          # (`no_boundary_root_appears_as_a_body`, `every_body_is_a_lake_root_never_a_mouth`)
          # and inverted to assert the new invariant -- net zero test count from the rename.
          # (2) `Extent`'s lat/lon box mishandled the antimeridian at scales already reached
          # (6/171 lake bodies at n=30,000, 8/799 at n=100,000, one single-node body at
          # 358.7 degrees of longitude), not only "as a body's scale approaches the planet's
          # circumference" as the pre-review doc comment reasoned rather than measured.
          # `lake_body_extents` now collects every member's `(lat, lon)` for a body and
          # `Extent::from_points` resolves longitude via `smallest_enclosing_longitude_arc`
          # (widest-gap-on-the-circle construction); `min_longitude_deg > max_longitude_deg`
          # now denotes a seam-crossing arc, documented on the struct itself. Four new unit
          # tests on the arc helper plus one hand-built fixture
          # (`a_lake_straddling_the_antimeridian_gets_the_narrow_arc_not_the_globe_spanning_
          # one`, two members 0.2 degrees apart on the planet but 359.7 degrees apart in raw
          # coordinates) are the five new unconditionally-compiled tests. LOW fixes alongside:
          # `extents[&i]` in `water_manifest` is now a guarded `.get(&i).unwrap_or(EMPTY_
          # EXTENT)` rather than an unguarded index, and `Extent::from_points`'s doc comment
          # now states its NaN-drops-silently latitude semantics. No new `#[cfg]`, no new
          # `#[ignore]`, so all five rows move by +5 uniformly and `expect_ignored` stays 5.
          # Body counts re-derived directly (temporary `#[ignore]`d measurement test, reverted
          # before commit, same method task-4-review.md used): at n=30,000, real `Spiral`-
          # sampled, `SEED=20_260_905`, `sea_level_m=0.0`, `pond_max_surface_area_m2=1.0e5` --
          # before, 1,232 bodies (1,061 ocean / 171 lake / 0 pond); after, 171 bodies (171 lake
          # / 0 pond), matching the review's own measurement exactly. Re-derived by `cargo test
          # -p worldbuilder-engine <cfg> -- --list` (and `--ignored`) per configuration,
          # cross-checked through `assert_counts.py cargo-list` itself.
          # Slice 2026-09-05-slice-relief-amplitude Task 3 added four tests for the
          # `ReliefParams::hills()` preset (`detail.rs`), +4 uniformly over Task 2's
          # 513/513/515/549/551 -- re-derived through `assert_counts.py cargo-list` itself,
          # not by hand arithmetic. See task-3-report.md.
          # Slice 2026-09-05-slice-relief-amplitude Task 4 opened the relief channel across
          # the WASM boundary (`wb_world_new_relief`, `wb_relief_preset`, `wb_relief_check`)
          # and added eight tests for it in `tests/wasm_exports.rs`. That file is
          # `#![cfg(feature = "wasm")]` in its entirety, so **only the two wasm rows move**,
          # by +8 each -- 553 -> 561 and 555 -> 563 -- and the three non-wasm rows stay at
          # 517/517/519. `expect_ignored` stays 5; no `#[ignore]`d test was added. Five of the
          # eight are sweeps rather than spot-checks (510 field-by-field records, 101 slider
          # positions, a 150-point cross product), which is why the file grew far more than
          # the count did. Re-derived per configuration through `assert_counts.py cargo-list`
          # itself against fresh `-- --list` / `-- --list --ignored` output, not by hand
          # arithmetic and never by grepping `test result:`. See task-4-report.md.
          # 2026-09-05, slice 5b Task 5 (parity, and a negative control): 561/563 -> 566/568
          # on the two wasm rows only, and 517/517/519 unchanged on the other three. Task 5
          # added `wb_water_run` -- the first export that reaches `water.rs` at all, which is
          # what makes slice 5b's water path comparable native-against-WASM rather than merely
          # unchecked -- and five tests for it in `tests/wasm_exports.rs`, a file that is
          # `#![cfg(feature = "wasm")]` in its entirety. Four of the five are sweeps rather
          # than spot-checks (171 sea-level records driven through the export and read back, a
          # pond-threshold hostile set, a node-count ladder, the buffer channel), and the sweep
          # found a REAL abort: at a datum below the world's own lowest sampled point there is
          # no boundary node anywhere, so the union of every lake basin is the whole graph and
          # `water::merge_tied_plateaus` panics through a nounwind `extern "C"` boundary --
          # measured as exit 0xc0000409 before `every_component_has_an_outlet` closed it.
          # `expect_ignored` stays 5; no `#[ignore]`d test was added. Re-derived per
          # configuration through `assert_counts.py cargo-list` itself against fresh
          # `-- --list` / `-- --list --ignored` output, which reported `count OK` at all five.
          # See task-5-report.md.
          # 2026-09-05, slice-mountains Task 1 (`TectonicParams`, opt-in, and `None`
          # bit-identity): 517/517/519/566/568 -> 521/521/523/570/572, +4 uniformly across
          # all five rows. Three of the four are non-wasm-gated tests added to
          # `tectonics.rs` alongside the new `TectonicParams` struct and its
          # `canonical()` (a bit-for-bit-against-the-module-constants check and two
          # margin-blend checks), and the fourth is `surface.rs`'s
          # `tectonics_none_matches_tectonics_some_canonical_bit_for_bit`, the task's own
          # required proof that `tectonics: None` and `tectonics:
          # Some(TectonicParams::canonical())` agree bit-for-bit. None of the four are
          # behind `#[cfg(feature = "wasm")]`, which is why the count moves by the same
          # +4 on every row rather than only the two wasm ones. `expect_ignored` stays 5;
          # no `#[ignore]`d test was added. Re-derived per configuration through
          # `assert_counts.py cargo-list` itself against fresh `-- --list` /
          # `-- --list --ignored` output, which reported `count OK` at all five. See
          # task-1-report.md.
          # 2026-09-05, slice-mountains Task 4 (the mountain sliders): 521/521/523/570/572 ->
          # 523/523/525/584/586. TWO SEPARATE MOVEMENTS, and only one of them is this task's.
          #
          # +2 UNIFORMLY IS A CORRECTION, NOT AN ADDITION. Re-deriving these numbers against a
          # CLEAN `git worktree` of 814c689 -- the commit the row above pinned -- lists 528 /
          # 530 / 577 / 579 with 5 ignored, which is 523/523/525/572/574 run. **The pinned
          # 521/521/523/570/572 was already two low at that commit, so this count gate was
          # already red before this task touched anything.** The two tests are in the crate
          # library and are therefore in every configuration, which is why the shortfall was
          # uniform; the likeliest source is 814c689's own one-ULP perturbation fixtures,
          # whose count was derived before that commit was finished. Recorded rather than
          # quietly folded in, because a pin that is corrected without saying so is a pin that
          # can be wrong again next slice.
          #
          # +12 ON THE TWO WASM ROWS ONLY is this task. `tests/wasm_exports.rs` is
          # `#![cfg(feature = "wasm")]` in its entirety and gains twelve tests for the tectonic
          # channel -- `wb_world_new_tectonic`, `wb_tectonic_preset` and `wb_tectonic_check`,
          # the exports that carry `TectonicParams` to the browser and give the owner the two
