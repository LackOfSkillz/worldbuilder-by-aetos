# TRIMMED, DELIBERATELY. This branch exists to prove ONE thing about the real workflow:
# that `--no-fail-fast` stops a failing unit test from concealing whether the determinism
# guard also failed. Nothing here changes what any gate ASSERTS; it changes only which jobs
# run, so the proof costs one job pair instead of the 7-job matrix.
#
# The tree is broken TWO ways at once, in the same shape Task 2 hit by accident:
#   * crates/worldbuilder-engine/src/features.rs   SETTLE_M 3.0 -> 3.5   (fails --lib)
#   * crates/worldbuilder-engine/src/lib.rs        an `f64::sqrt(` form  (fails no_std_math)
#
# Two jobs, same tree, one flag apart. `before` reproduces the old behaviour and must show
# ONLY the lib failure, with `Running tests\no_std_math.rs` absent from its log. `after` is
# what the real workflow now runs and must show BOTH.
name: gates
on:
  push:
  workflow_dispatch:
env:
  RUST_VERSION: "1.98.0"
  PYTHON_VERSION: "3.11"
  CARGO_TERM_COLOR: always
jobs:
  before:
    name: BEFORE -- cargo test (fail-fast) hides the determinism guard
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Pin the Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
      - name: cargo test --no-default-features
        shell: bash
        run: cargo test -p worldbuilder-engine --no-default-features

  after:
    name: AFTER -- --no-fail-fast shows both
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Pin the Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
      - name: cargo test --no-default-features --no-fail-fast
        shell: bash
        run: cargo test -p worldbuilder-engine --no-default-features --no-fail-fast
