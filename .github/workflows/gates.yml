# Every gate this project has built, run on every push.
#
# The argument for this file is in docs/superpowers/plans/2026-09-04-slice-ci.md, and it is
# not "CI is good practice". Three specific things went wrong here and each survived several
# commits BECAUSE nothing ran the check that would have caught it: a conformance suite that
# skipped silently and reported green while comparing nothing; a shipped `.wasm` that was
# several commits stale and passing parity; and a provenance guard that was itself
# unreproducible from git and failed on every machine but its author's. A gate nobody runs
# is a gate that can rot without anyone noticing.
#
# Design notes that are load-bearing, not decoration:
#
#   * EVERYTHING RUNS ON WINDOWS, AND THE TOOLCHAIN IS PINNED TO 1.98.0. This is not a
#     preference. `viewer/public/wasm/MANIFEST.txt` records
#         toolchain: rustc 1.98.0 88d9e12ae178... x86_64-pc-windows-msvc
#     and `checkFreshness()` in viewer/scripts/build-wasm.mjs folds that exact string --
#     release, commit hash AND HOST TRIPLE -- into the source fingerprint. A Linux runner
#     computes a different fingerprint from byte-identical source, so `npm run check:wasm`
#     would report STALE ARTIFACT on every run, and the parity harness -- which refuses to
#     report parity against a stale artifact -- would refuse with it. The provenance gate is
#     satisfiable only on the host family that built the artifact. That is a property of the
#     gate as designed; this slice runs the gates, it does not change them.
#     Pinning the release matters for the same reason: `rustup default stable` would move off
#     1.98.0 the day upstream ships 1.99 and turn provenance red for a reason that has
#     nothing to do with the artifact.
#
#     The engine matrix could in principle run on Linux, but `--features python` cannot:
#     pyo3's `extension-module` deliberately does not link libpython on Unix, so the test
#     binary that links the rlib fails to resolve `Py_*`. Windows links pythonXX.lib and the
#     tests build. Two of the five configurations are Windows-only in practice, and the
#     recorded baselines (409/0/5 and 439/0/5) were taken there, so the whole matrix stays on
#     the host the baselines came from.
#
#   * NOTHING IS CACHED. Deliberately. Every failure this workflow exists to catch is a
#     stale-artifact failure -- a `target/` or a `.wasm` that no longer matches its source.
#     A cache keyed on anything less than the full fingerprint would reproduce that exact
#     class of bug INSIDE the thing built to detect it, and the first time it did the symptom
#     would be a green run. A clean checkout every time is the only cache policy that cannot
#     lie. The cost is recompiling two pinned dependencies (blake2, libm) and one small crate
#     per job. If build time ever becomes the binding constraint, the cache key must include
#     the same 28-input source fingerprint MANIFEST.txt records, not `Cargo.lock` alone.
#
#   * NO ARTIFACT IS REBUILT BEFORE IT IS CHECKED. The provenance job checks the COMMITTED
#     `.wasm` against the source in the same commit. Building it first would make the gate
#     tautological -- it would prove the runner can compile, not that what is committed
#     matches what is committed alongside it.
#
# NOT COVERED HERE, and Task 3 must say so out loud rather than let a green badge imply
# otherwise: the viewer's browser checks -- eleven checks and seven `?fault=` values -- still
# need a browser and a person.

name: gates

# `push` on every branch, and nothing else. `pull_request` is deliberately absent: this is a
# private repository, Windows runners bill at 2x, and a branch pushed here and then opened as
# a PR would run the whole matrix twice for the same commit. Every commit that reaches the
# remote is still gated. Add `pull_request` if this ever takes contributions from forks, whose
# commits never reach a branch here.
on:
  push:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The toolchain MANIFEST.txt was fingerprinted with. Changing this without rebuilding the
  # artifact turns the provenance gate red, which is the gate working.
  RUST_VERSION: "1.98.0"
  # The local .venv is Python 3.11.0. The conformance suite's ULP bounds are measured against
  # a platform libm, so the interpreter is pinned rather than floating.
  PYTHON_VERSION: "3.11"
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------------------------------
  # The engine suite in all five feature configurations, which is also where the determinism
  # guard (tests/no_std_math.rs) runs -- it scans all of src/ and fails on a `f64::` form, a
  # `mul_add`, or an unmarked numeric cast. It runs five times because it is a test like any
  # other; that costs nothing, and the alternative is a sixth job that could drift out of step
  # with the suite it lives in.
  #
  # Baselines: 418 passed / 0 failed / 5 ignored under no-default-features and default;
  # 420/0/5 under python; 448/0/5 under wasm; 450/0/5 under python+wasm. These ARE asserted,
  # by a second step that
  # reads `cargo test -- --list` -- not by grepping `test result:`, which is how a suite that
  # ran nothing gets called green. See the step's own comment.
  # ---------------------------------------------------------------------------------------
  engine:
    name: engine (${{ matrix.name }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # `expect` is the number of tests that must RUN in that configuration, and
          # `expect_ignored` the number that must be marked ignored. The wasm configurations
          # compile tests/wasm_exports.rs, which is 30 tests the other three never see.
          #
          # 2026-09-04, slice identity: these moved 409/439 -> 418/448 when build.rs and
          # tests/build_fingerprint.rs landed. The `python` rows are TWO HIGHER than their
          # non-python neighbours (420 and 450) because source_fingerprint() and Task 3's
          # source_fingerprint_inputs() are both PyO3 exports whose binding tests only
          # compile with that feature. Re-derived on this host by
          # `cargo test -p worldbuilder-engine <cfg> -- --list`, counting `: test$` lines and
          # subtracting the 5 ignored: 423/423/425/453/455 listed.
          - name: no-default-features
            features: "--no-default-features"
            expect: 418
            expect_ignored: 5
          - name: default
            features: ""
            expect: 418
            expect_ignored: 5
          - name: python
            features: "--features python"
            expect: 420
            expect_ignored: 5
          - name: wasm
            features: "--features wasm"
            expect: 448
            expect_ignored: 5
          - name: python+wasm
            features: "--features python,wasm"
            expect: 450
            expect_ignored: 5
    steps:
      - uses: actions/checkout@v4

      # pyo3's build script needs an interpreter to find headers and pythonXX.lib. Set up
      # before Rust so it is on PATH when cargo runs.
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Pin the Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
          rustc -vV
          cargo --version

      # `--no-fail-fast` is load-bearing, not tidiness. Cargo runs the lib's unit tests
      # first and, by default, STOPS at the first test binary that fails -- so a single
      # failing unit test means `tests/no_std_math.rs` never executes and THE DETERMINISM
      # GUARD IS NEVER EVALUATED. Task 2 hit exactly that: a branch that changed a constant
      # went red on `--lib` and the log shows no_std_math was never reached, so the job was
      # red for a reason nobody had checked. One gate silently hiding another is the same
      # shape as every other failure this workflow exists to catch.
      #
      # This changes WHAT RUNS, not what is asserted: every test still has to pass, and the
      # step's exit status is still the gate. It only stops cargo from concealing the rest.
      - name: cargo test ${{ matrix.features }}
        shell: bash
        run: cargo test -p worldbuilder-engine ${{ matrix.features }} --no-fail-fast

      # THE COUNT GATE. The step above asks "did anything fail". It cannot ask "did anything
      # RUN": a suite whose tests are deleted, or whose `#[cfg]` stops matching, exits 0.
      # That is the same shape as the conformance suite that skipped silently and reported
      # green for a whole slice, so it is asserted rather than assumed.
      #
      # It does NOT grep `test result:`. It reads `cargo test -- --list`, which states the
      # same number twice in two different formats -- one `<name>: test` line per test, and a
      # `<N> tests, <M> benchmarks` trailer per binary -- and fails if those two disagree or
      # if either is absent. A format change turns this red saying so; it cannot go green by
      # matching nothing. See .github/scripts/assert_counts.py.
      #
      # Sound only because it runs AFTER the step above: `--list` says what exists, the exit
      # status above says none of them failed. Neither alone is the claim.
      - name: Assert the count -- ${{ matrix.expect }} run, ${{ matrix.expect_ignored }} ignored
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p worldbuilder-engine ${{ matrix.features }} -- --list > list-all.txt
          cargo test -p worldbuilder-engine ${{ matrix.features }} -- --list --ignored > list-ignored.txt
          python .github/scripts/assert_counts.py cargo-list             --all list-all.txt --ignored list-ignored.txt             --expect-passed ${{ matrix.expect }} --expect-ignored ${{ matrix.expect_ignored }}

  # ---------------------------------------------------------------------------------------
  # Python conformance against the built engine.
  #
  # WORLDBUILDER_REQUIRE_ENGINE=1 IS THE POINT OF THIS JOB. Without it,
  # tests/test_conformance.py falls through to `pytest.importorskip`, and a missing or stale
  # `worldbuilder_engine` produces a green run that compared nothing. That happened here for a
  # whole slice. With it set the import is unguarded and a missing engine is a hard error.
  # ---------------------------------------------------------------------------------------
  python-conformance:
    name: python conformance
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Only for `node scripts/build-wasm.mjs digest` below, which computes the Node half
      # of Task 3's fingerprint-parity gate. It reads and hashes source files; it builds
      # nothing and never touches viewer/public/wasm.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Pin the Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
          rustc -vV

      # A real virtualenv, because `maturin develop` installs into VIRTUAL_ENV and refuses
      # without one. Putting it on GITHUB_PATH makes every later step use it.
      - name: Create the virtualenv
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .venv
          echo "$PWD/.venv/Scripts" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"

      - name: Install the test harness
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "maturin==1.15.0" pytest

      # The standing gap this used to be (fixed by the identity slice's Task 1, kept here so
      # the next person can see what it was): pyproject.toml declared setuptools as its build
      # backend while the extension was built by maturin, and BOTH BACKENDS PRODUCED THE SAME
      # DISTRIBUTION NAME. maturin walked up to the root pyproject.toml, read
      # `[project] name = "worldbuilder-by-aetos"`, and built a wheel of that name containing
      # only `worldbuilder_engine` -- so installing it UNINSTALLED a prior `pip install -e .`
      # and took the pure-Python `worldbuilder/` package with it. The first CI run did exactly
      # that and collected 14 `ModuleNotFoundError: No module named 'worldbuilder'` errors.
      # tests/test_installation.py is the regression test for this: it imports `worldbuilder`
      # from a subprocess whose cwd is outside the repo, so the "pytest runs from the repo
      # root and sys.path papers over a missing install" crutch cannot hide the bug returning.
      #
      # The fix: crates/worldbuilder-engine/pyproject.toml gives the extension its own
      # distribution name (`worldbuilder-engine`, maturin backend), so the two installs no
      # longer share a dist-info.
      #
      # The order below -- `pip install -e .` first, then maturin -- is the order that was
      # NECESSARY BEFORE THE SPLIT and is retained deliberately, not because it is still
      # load-bearing. Once the names differ it should not matter: pip's uninstall-then-install
      # keys on the project name, the two RECORDs are name-isolated, and the engine's
      # pyproject.toml declares no `python-source`, so maturin structurally cannot see
      # `worldbuilder/`. That reasoning is unverified -- reversing the order empirically needs
      # a `pip uninstall` nobody has run. Keep the order until someone does; do not cite it as
      # a settled dependency.
      - name: Install the reference package (editable)
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e . --no-deps
          python -c "import worldbuilder; print('reference imported from', worldbuilder.__file__)"

      - name: Build the engine wheel (maturin, its own distribution now)
        shell: bash
        run: |
          set -euo pipefail
          maturin develop --release --features python -m crates/worldbuilder-engine/Cargo.toml
          python -c "import worldbuilder_engine; print('engine imported from', worldbuilder_engine.__file__)"

      # THE FINGERPRINT PARITY GATE. Task 2 gave the Python extension the same source
      # fingerprint `.wasm` provenance uses, by writing a SECOND implementation of the
      # digest in Rust (`build.rs` + `bindings.rs::source_fingerprint`), because `maturin
      # develop` does not run node. The ruling that allowed that duplication was explicit:
      # "duplication that is checked is not duplication that rots." Nothing asserted the
      # two implementations agree until this step existed.
      #
      # `node scripts/build-wasm.mjs digest` prints ONLY the Node-computed digest and its
      # input count -- no build, no artifact touched -- as the independent statement this
      # gate compares against the Rust-embedded `source_fingerprint()` /
      # `source_fingerprint_inputs()` PyO3 exports the just-built extension carries.
      - name: Compute the node-side source fingerprint (Task 3's other half)
        shell: bash
        working-directory: viewer
        run: |
          set -euo pipefail
          node scripts/build-wasm.mjs digest | tee ../node-fingerprint.out

      # See .github/scripts/assert_fingerprint_parity.py's own docstring for why this does
      # not simply compare two strings: both sides' digest and input count are validated
      # on their own terms -- 64-char lowercase hex, positive decimal integer -- before
      # comparison, and the extension failing to import is treated as the entire Rust side
      # being absent rather than an unrelated crash. A comparison that could read two
      # empty/malformed values as "equal" is the exact defect class this project keeps
      # finding elsewhere.
      - name: Assert the node and rust source fingerprints agree
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/assert_fingerprint_parity.py --node-output node-fingerprint.out

      # Collected BEFORE the run, and kept, because it is one of the two independent
      # statements the count gate cross-checks. `-q` prints one node id per test and a
      # `<N> tests collected in <T>s` trailer; the run below prints `<N> passed in <T>s`.
      # Two formats, two productions, one number.
      - name: Collect the suite (one of the two counts)
        shell: bash
        env:
          WORLDBUILDER_REQUIRE_ENGINE: "1"
        run: |
          set -euo pipefail
          python -m pytest tests/ --collect-only -q 2>&1 | tee collect.out

      - name: pytest with the engine REQUIRED
        shell: bash
        env:
          WORLDBUILDER_REQUIRE_ENGINE: "1"
        run: |
          set -euo pipefail
          python -c "import worldbuilder; print('reference imported from', worldbuilder.__file__)"
          python -m pytest tests/ 2>&1 | tee pytest.out

      # THE COUNT GATE, python half. The step above asks "did anything fail". It cannot ask
      # "did anything RUN", and on THIS suite that distinction has already cost a slice:
      # with WORLDBUILDER_REQUIRE_ENGINE unset and no engine built, tests/test_conformance.py
      # skips AT IMPORT, all 156 of its comparisons collapse into one `1 skipped`, and pytest
      # exits 0 reporting `240 passed, 1 skipped`. Green, having compared nothing. Nobody
      # scanning that log finds a suspicious number, because there isn't one.
      #
      # So the size is asserted, per file and in total, from two independently-produced
      # statements that must agree -- and the script fails hard if either is absent, rather
      # than matching nothing and calling it clean.
      #
      # 397 = 156 in test_conformance.py + 240 across the other thirteen pre-existing files +
      # 1 in tests/test_installation.py (added by the identity slice's Task 1; it needs a
      # subprocess with a different cwd, so it could not be an ordinary unit test, and it
      # joins this suite rather than living elsewhere because this count gate is the thing
      # that would otherwise let it silently stop running). NOTE: the Task 2 report reads
      # "390 conformance, 240 elsewhere"; that is a misreading of its own run -- 390 was the
      # WHOLE suite before this file existed. Re-derived here from `--collect-only -q`.
      #
      # 156 = the 150 conformance comparisons pinned above, plus 6 unit tests Task 4 added
      # for `_require_current_engine`/`_manifest_source_fingerprint` (the staleness guard
      # that makes WORLDBUILDER_REQUIRE_ENGINE=1 reject a stale engine, not just a missing
      # one). Those 6 exercise the pure helper functions with a fake engine object and a
      # tmp_path manifest -- the module-level gate itself runs once, at collection, before
      # any test function exists to assert against it.
      - name: Assert the suite -- 397 tests, 156 of them conformance
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/assert_counts.py pytest \
            --collect collect.out --run pytest.out \
            --expect-total 397 --expect-file tests/test_conformance.py=156

  # ---------------------------------------------------------------------------------------
  # Provenance and parity. One job, because parity.mjs imports checkFreshness() from
  # build-wasm.mjs and refuses to report parity against an artifact that fails it -- they are
  # one chain, and splitting them across runners would let the parity half run somewhere the
  # provenance half was never asked.
  #
  # The parity harness shells out to `rustc -vV` from Node, so Rust and Node must be on the
  # SAME runner. Node alone is not enough.
  #
  # No `npm ci`: build-wasm.mjs and parity.mjs import node builtins only, and viewer's single
  # dependency is CesiumJS, which neither touches. Downloading it would add minutes and a
  # network dependency to a gate that is a content hash.
  # ---------------------------------------------------------------------------------------
  provenance-and-parity:
    name: provenance + parity
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Only for .github/scripts/assert_counts.py, which asserts the corpus size.
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Pin the Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
          # For `npm run build:wasm:self-test`, which really builds.
          rustup target add wasm32-unknown-unknown
          # Printed because this exact string -- release, commit hash and host triple -- is
          # folded into the source fingerprint. When provenance goes red, this is the first
          # line to read.
          rustc -vV

      # Diagnostic, not an assertion. `* text=auto eol=lf` was verified to reproduce the
      # fingerprint on clones at both core.autocrlf settings, but a CI checkout is a third
      # checkout with its own conventions and this project keeps finding that kind of
      # assumption wrong. If provenance fails, this output says immediately whether line
      # endings are why. A hard check here would be adding a gate, which this slice must not
      # do.
      - name: Line endings of the fingerprinted inputs (diagnostic)
        shell: bash
        run: |
          git config --get core.autocrlf || echo "core.autocrlf: (unset)"
          git ls-files --eol -- crates/worldbuilder-engine/src Cargo.toml Cargo.lock crates/worldbuilder-engine/Cargo.toml

      - name: Provenance -- does the shipped .wasm match the source in this commit?
        shell: bash
        working-directory: viewer
        run: npm run check:wasm

      # Two gates the plan's table does not list but the project's own "everything that must
      # be re-run" block in viewer/README.md does. They are the provenance chain's proofs that
      # it can refuse, and they need no browser and no person, so leaving them out would have
      # meant shipping a CI slice that omits the cheapest fail-proofs in the repository.
      #
      # `stale-self-test` copies the fingerprint inputs to a temp tree, edits one line there,
      # and confirms the real fingerprint function reports a different digest -- seconds, no
      # build, and it never touches crates/.
      #
      # `self-test` builds WITHOUT `--features wasm`, reproducing the historical 327-byte
      # memory-only artifact, and confirms the strict shape assertion rejects it; then it
      # rebuilds the real one. It works entirely in `target/` and never writes
      # viewer/public/wasm, so it cannot disturb the artifact the step above just vouched for.
      # It is placed AFTER the provenance check so nothing has compiled before that question
      # is asked.
      - name: Can the staleness fingerprint refuse a tree that moved?
        shell: bash
        working-directory: viewer
        run: npm run build:wasm:stale-self-test

      - name: Can the build-shape assertion reject an empty artifact?
        shell: bash
        working-directory: viewer
        run: npm run build:wasm:self-test

      - name: Parity -- native dump
        shell: bash
        working-directory: crates/worldbuilder-engine/parity
        run: cargo run --release -p worldbuilder-engine --example parity_dump --features wasm > native.txt

      # `tee` under `pipefail` so the harness's own exit status still decides the step while
      # its output is kept for the count assertion below.
      - name: Parity -- replay through the committed .wasm
        shell: bash
        working-directory: crates/worldbuilder-engine/parity
        run: |
          set -euo pipefail
          node parity.mjs native.txt 2>&1 | tee parity.out

      # THE COUNT GATE, parity half. `0 divergent` is only as strong as the number of values
      # it is zero out of. `examples/parity_dump.rs` was NOT a fingerprinted input until
      # 2026-09-04 -- run 33916847441 shrank the corpus by a sixth with provenance, parity
      # and `cargo test` all green, and this gate was the only thing that noticed. It is a
      # fingerprint input now, so provenance refuses too; the two are independent and both
      # are kept. 53,251 is the recorded population; the script also checks the nine
      # per-group tallies sum to it, so a format change fails loudly instead of matching
      # nothing.
      - name: Assert the corpus -- 53,251 values, 0 divergent
        shell: bash
        working-directory: crates/worldbuilder-engine/parity
        run: |
          set -euo pipefail
          python "$GITHUB_WORKSPACE/.github/scripts/assert_counts.py" parity             --output parity.out --expect-label parity             --expect-compared 53251 --expect-divergent 0

      # The control. The harness's own documented proof that it can notice a wrong answer:
      # `--mutate seed` moves the world seed by one and 50,778 of 53,251 values diverge. A
      # parity run whose harness cannot fail is not evidence, and this is the cheapest place
      # in the project to keep proving that it can.
      - name: Parity -- the control (a harness that cannot fail is not evidence)
        shell: bash
        working-directory: crates/worldbuilder-engine/parity
        run: |
          set -euo pipefail
          node parity.mjs native.txt --mutate seed 2>&1 | tee control.out

      # The control's own count. "the harness can be made to fail" is satisfied by ONE
      # divergent value; the recorded figure is 50,778 of 53,251, and a control that
      # collapsed to a handful would still exit 0 while proving far less than the record says
      # it proves.
      - name: Assert the control -- 50,778 of 53,251 divergent
        shell: bash
        working-directory: crates/worldbuilder-engine/parity
        run: |
          set -euo pipefail
          python "$GITHUB_WORKSPACE/.github/scripts/assert_counts.py" parity             --output control.out --expect-label "CONTROL (--mutate seed)"             --expect-compared 53251 --expect-divergent 50778
