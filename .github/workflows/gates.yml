          # configuration through `assert_counts.py cargo-list` itself against fresh
          # `-- --list` / `-- --list --ignored` output. See task-4-report.md.
          #
          # 2026-09-05, slice-mountains Task 2 (the structure field): 523/523/525/584/586 ->
          # 538/538/540/599/601, +15 UNIFORMLY on every row. Every one of the fifteen is in
          # the crate library and none is feature-gated, which is why the move is the same on
          # all five. `noise.rs` gains five for the new `ridged` multifractal (the unit-interval
          # sweep over 4,000 samples at three coordinate scales, purity, zero octaves, a NaN
          # frequency flooring rather than propagating, and the one that makes the primitive
          # worth having -- ridged creases measured two orders of magnitude sharper than fbm's
          # by largest second difference, both normalised to the same scale first).
          # `continentality.rs` gains one, pinning that the world seed it now records for
          # `Tectonics` is not read by that module. `tectonics.rs` gains nine for the opt-in
          # structure fields: the bit-for-bit inertness proof that `canonical()` reduces to the
          # pre-Task-2 collision expression over a -420..+420 km sweep (Ruling 1's whole safety
          # argument), symmetric-`asymmetric_bump`-is-`bump` with its discrimination, the
          # published 1.67 flank-width ratio measured by bisecting the shipped function, each
          # structure field moving the answer at a STATED setting (the complement of the ULP
          # sweep, which is structurally blind to fields whose canonical value is 0.0), the
          # wavelength asserted blind until the depth is raised, the multiplier's range swept
          # over a global grid, the ordered-pair suture hash, `collision_reach_m` checked
          # against where the profile actually stops, and the reach that exceeds the range
          # gate. **`assert_counts.py` now reports TWELVE test binaries rather than eleven:**
          # `src/bin/mountain_survey.rs` is a new `[[bin]]` and contributes 0 tests, exactly as
          # `erosion_convergence_sweep.rs`, `relief_survey.rs`, `pond_threshold_survey.rs`,
          # `mountain_probe.rs` and `streambench.rs` do. `expect_ignored` stays 5; no
          # `#[ignore]`d test was added. Re-derived per configuration through
          # `assert_counts.py cargo-list` itself against fresh `-- --list` /
          # `-- --list --ignored` output, which reported `count OK` at all five. See
          # task-2-report.md.
          #
          # 2026-09-05, slice mountains Task 3 (the preset, and the structure fields crossing
          # the WASM boundary): 538/538/540/599/601 -> 542/542/544/609/611. Two different
          # movements, and only one of them lands on every row.
          #   * +4 on ALL five, from `src/tectonics.rs`, which compiles unconditionally: the
          #     four tests for `TectonicParams::ranges()` (only the six named fields move; the
          #     `None` path is still bit-identical after a second constructor exists beside
          #     canonical; the preset sits inside the range gate with a stated margin; and it
          #     differs from BOTH canonical and its own bare envelope, so the structure fields
          #     are proved to be doing something rather than the envelope alone).
          #   * +6 on the two WASM rows only, from `tests/wasm_exports.rs`, which is
          #     `#![cfg(feature = "wasm")]` in its entirety: the preset crossing as fields, the
          #     `suture_count` loop-bound refusal and its sampled interior, the stacked-profile
          #     range-gate refusal, the `collision_asymmetry` floor and derived ceiling, the
          #     five structure fields swept together, and a pin on the sweep's own size
          #     (1,644 records, 947 accepted) so a later change that halves it goes red with
          #     both numbers rather than passing at one over a threshold.
          # `expect_ignored` stays 5; no `#[ignore]`d test was added, and no test binary was.
          # Re-derived per configuration through `assert_counts.py cargo-list` itself against
          # fresh `-- --list` / `-- --list --ignored` output, AFTER the last source edit, and
          # the 032b41f baseline (538/538/540/599/601) was re-derived the same way BEFORE the
          # first edit rather than trusted -- this pin block was found already wrong once in
          # this slice. See task-3-report.md.
          - name: no-default-features
            features: "--no-default-features"
            expect: 542
            expect_ignored: 5
          - name: default
            features: ""
            expect: 542
            expect_ignored: 5
          - name: python
            features: "--features python"
            expect: 544
            expect_ignored: 5
          - name: wasm
            features: "--features wasm"
            expect: 609
            expect_ignored: 5
          - name: python+wasm
            features: "--features python,wasm"
            expect: 611
            expect_ignored: 5
    steps:
      - uses: actions/checkout@v4

      # pyo3's build script needs an interpreter to find headers and pythonXX.lib. Set up
      # before Rust so it is on PATH when cargo runs.
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Pin the Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
          rustc -vV
          cargo --version

      # `--no-fail-fast` is load-bearing, not tidiness. Cargo runs the lib's unit tests
      # first and, by default, STOPS at the first test binary that fails -- so a single
      # failing unit test means `tests/no_std_math.rs` never executes and THE DETERMINISM
      # GUARD IS NEVER EVALUATED. Task 2 hit exactly that: a branch that changed a constant
      # went red on `--lib` and the log shows no_std_math was never reached, so the job was
      # red for a reason nobody had checked. One gate silently hiding another is the same
      # shape as every other failure this workflow exists to catch.
      #
      # This changes WHAT RUNS, not what is asserted: every test still has to pass, and the
      # step's exit status is still the gate. It only stops cargo from concealing the rest.
      - name: cargo test ${{ matrix.features }}
        shell: bash
        run: cargo test -p worldbuilder-engine ${{ matrix.features }} --no-fail-fast

      # THE COUNT GATE. The step above asks "did anything fail". It cannot ask "did anything
      # RUN": a suite whose tests are deleted, or whose `#[cfg]` stops matching, exits 0.
      # That is the same shape as the conformance suite that skipped silently and reported
      # green for a whole slice, so it is asserted rather than assumed.
      #
      # It does NOT grep `test result:`. It reads `cargo test -- --list`, which states the
      # same number twice in two different formats -- one `<name>: test` line per test, and a
      # `<N> tests, <M> benchmarks` trailer per binary -- and fails if those two disagree or
      # if either is absent. A format change turns this red saying so; it cannot go green by
      # matching nothing. See .github/scripts/assert_counts.py.
      #
      # Sound only because it runs AFTER the step above: `--list` says what exists, the exit
      # status above says none of them failed. Neither alone is the claim.
      - name: Assert the count -- ${{ matrix.expect }} run, ${{ matrix.expect_ignored }} ignored
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p worldbuilder-engine ${{ matrix.features }} -- --list > list-all.txt
          cargo test -p worldbuilder-engine ${{ matrix.features }} -- --list --ignored > list-ignored.txt
          python .github/scripts/assert_counts.py cargo-list             --all list-all.txt --ignored list-ignored.txt             --expect-passed ${{ matrix.expect }} --expect-ignored ${{ matrix.expect_ignored }}

  # ---------------------------------------------------------------------------------------
  # Python conformance against the built engine.
  #
  # WORLDBUILDER_REQUIRE_ENGINE=1 IS THE POINT OF THIS JOB. Without it,
  # tests/test_conformance.py falls through to `pytest.importorskip`, and a missing or stale
  # `worldbuilder_engine` produces a green run that compared nothing. That happened here for a
  # whole slice. With it set the import is unguarded and a missing engine is a hard error.
  # ---------------------------------------------------------------------------------------
  python-conformance:
    name: python conformance
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Only for `node scripts/build-wasm.mjs digest` below, which computes the Node half
      # of Task 3's fingerprint-parity gate. It reads and hashes source files; it builds
      # nothing and never touches viewer/public/wasm.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Pin the Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
          rustc -vV

      # A real virtualenv, because `maturin develop` installs into VIRTUAL_ENV and refuses
      # without one. Putting it on GITHUB_PATH makes every later step use it.
      - name: Create the virtualenv
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .venv
          echo "$PWD/.venv/Scripts" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"

      - name: Install the test harness
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "maturin==1.15.0" pytest

      # The standing gap this used to be (fixed by the identity slice's Task 1, kept here so
      # the next person can see what it was): pyproject.toml declared setuptools as its build
      # backend while the extension was built by maturin, and BOTH BACKENDS PRODUCED THE SAME
      # DISTRIBUTION NAME. maturin walked up to the root pyproject.toml, read
      # `[project] name = "worldbuilder-by-aetos"`, and built a wheel of that name containing
      # only `worldbuilder_engine` -- so installing it UNINSTALLED a prior `pip install -e .`
      # and took the pure-Python `worldbuilder/` package with it. The first CI run did exactly
      # that and collected 14 `ModuleNotFoundError: No module named 'worldbuilder'` errors.
      # tests/test_installation.py is the regression test for this: it imports `worldbuilder`
      # from a subprocess whose cwd is outside the repo, so the "pytest runs from the repo
      # root and sys.path papers over a missing install" crutch cannot hide the bug returning.
      #
      # The fix: crates/worldbuilder-engine/pyproject.toml gives the extension its own
      # distribution name (`worldbuilder-engine`, maturin backend), so the two installs no
      # longer share a dist-info.
      #
      # The order below -- `pip install -e .` first, then maturin -- is the order that was
      # NECESSARY BEFORE THE SPLIT and is retained deliberately, not because it is still
      # load-bearing. Once the names differ it should not matter: pip's uninstall-then-install
      # keys on the project name, the two RECORDs are name-isolated, and the engine's
      # pyproject.toml declares no `python-source`, so maturin structurally cannot see
      # `worldbuilder/`. That reasoning is unverified -- reversing the order empirically needs
      # a `pip uninstall` nobody has run. Keep the order until someone does; do not cite it as
      # a settled dependency.
      - name: Install the reference package (editable)
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e . --no-deps
          python -c "import worldbuilder; print('reference imported from', worldbuilder.__file__)"

      - name: Build the engine wheel (maturin, its own distribution now)
        shell: bash
        run: |
          set -euo pipefail
          maturin develop --release --features python -m crates/worldbuilder-engine/Cargo.toml
          python -c "import worldbuilder_engine; print('engine imported from', worldbuilder_engine.__file__)"

      # THE FINGERPRINT PARITY GATE. Task 2 gave the Python extension the same source
      # fingerprint `.wasm` provenance uses, by writing a SECOND implementation of the
      # digest in Rust (`build.rs` + `bindings.rs::source_fingerprint`), because `maturin
      # develop` does not run node. The ruling that allowed that duplication was explicit:
      # "duplication that is checked is not duplication that rots." Nothing asserted the
      # two implementations agree until this step existed.
      #
      # `node scripts/build-wasm.mjs digest` prints ONLY the Node-computed digest and its
      # input count -- no build, no artifact touched -- as the independent statement this
      # gate compares against the Rust-embedded `source_fingerprint()` /
      # `source_fingerprint_inputs()` PyO3 exports the just-built extension carries.
      - name: Compute the node-side source fingerprint (Task 3's other half)
        shell: bash
        working-directory: viewer
        run: |
          set -euo pipefail
          node scripts/build-wasm.mjs digest | tee ../node-fingerprint.out

      # See .github/scripts/assert_fingerprint_parity.py's own docstring for why this does
      # not simply compare two strings: both sides' digest and input count are validated
      # on their own terms -- 64-char lowercase hex, positive decimal integer -- before
      # comparison, and the extension failing to import is treated as the entire Rust side
      # being absent rather than an unrelated crash. A comparison that could read two
      # empty/malformed values as "equal" is the exact defect class this project keeps
      # finding elsewhere.
      - name: Assert the node and rust source fingerprints agree
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/assert_fingerprint_parity.py --node-output node-fingerprint.out

      # Collected BEFORE the run, and kept, because it is one of the two independent
      # statements the count gate cross-checks. `-q` prints one node id per test and a
      # `<N> tests collected in <T>s` trailer; the run below prints `<N> passed in <T>s`.
      # Two formats, two productions, one number.
      - name: Collect the suite (one of the two counts)
        shell: bash
        env:
          WORLDBUILDER_REQUIRE_ENGINE: "1"
        run: |
          set -euo pipefail
          python -m pytest tests/ --collect-only -q 2>&1 | tee collect.out

      - name: pytest with the engine REQUIRED
        shell: bash
        env:
          WORLDBUILDER_REQUIRE_ENGINE: "1"
        run: |
          set -euo pipefail
          python -c "import worldbuilder; print('reference imported from', worldbuilder.__file__)"
          python -m pytest tests/ 2>&1 | tee pytest.out

      # THE COUNT GATE, python half. The step above asks "did anything fail". It cannot ask
      # "did anything RUN", and on THIS suite that distinction has already cost a slice:
      # with WORLDBUILDER_REQUIRE_ENGINE unset and no engine built, tests/test_conformance.py
      # skips AT IMPORT, all 157 of its tests (150 conformance comparisons plus 7 guard
      # unit tests Task 4 added) collapse into one `1 skipped`, and pytest exits 0
      # reporting `241 passed, 1 skipped` (240 in the other thirteen pre-existing files
      # plus the 1 test_installation.py Task 1 added). Green, having compared nothing.
      # Nobody scanning that log finds a suspicious number, because there isn't one.
      #
      # So the size is asserted, per file and in total, from two independently-produced
      # statements that must agree -- and the script fails hard if either is absent, rather
      # than matching nothing and calling it clean.
      #
      # 398 = 157 in test_conformance.py + 240 across the other thirteen pre-existing files +
      # 1 in tests/test_installation.py (added by the identity slice's Task 1; it needs a
      # subprocess with a different cwd, so it could not be an ordinary unit test, and it
      # joins this suite rather than living elsewhere because this count gate is the thing
      # that would otherwise let it silently stop running). NOTE: the Task 2 report reads
      # "390 conformance, 240 elsewhere"; that is a misreading of its own run -- 390 was the
      # WHOLE suite before this file existed. Re-derived here from `--collect-only -q`.
      #
      # 157 = the 150 conformance comparisons pinned above, plus 7 unit tests Task 4 added
      # for `_require_current_engine`/`_manifest_source_fingerprint` (the staleness guard
      # that makes WORLDBUILDER_REQUIRE_ENGINE=1 reject a stale engine, not just a missing
      # one). Those 6 exercise the pure helper functions with a fake engine object and a
      # tmp_path manifest -- the module-level gate itself runs once, at collection, before
      # any test function exists to assert against it.
      - name: Assert the suite -- 398 tests, 157 of them conformance
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/assert_counts.py pytest \
            --collect collect.out --run pytest.out \
            --expect-total 398 --expect-file tests/test_conformance.py=157

  # ---------------------------------------------------------------------------------------
  # Provenance and parity. One job, because parity.mjs imports checkFreshness() from
  # build-wasm.mjs and refuses to report parity against an artifact that fails it -- they are
  # one chain, and splitting them across runners would let the parity half run somewhere the
  # provenance half was never asked.
  #
  # The parity harness shells out to `rustc -vV` from Node, so Rust and Node must be on the
  # SAME runner. Node alone is not enough.
  #
  # No `npm ci`: build-wasm.mjs and parity.mjs import node builtins only, and viewer's single
  # dependency is CesiumJS, which neither touches. Downloading it would add minutes and a
  # network dependency to a gate that is a content hash.
  # ---------------------------------------------------------------------------------------
  provenance-and-parity:
    name: provenance + parity
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Only for .github/scripts/assert_counts.py, which asserts the corpus size.
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Pin the Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
          # For `npm run build:wasm:self-test`, which really builds.
          rustup target add wasm32-unknown-unknown
          # Printed because this exact string -- release, commit hash and host triple -- is
          # folded into the source fingerprint. When provenance goes red, this is the first
          # line to read.
          rustc -vV

      # Diagnostic, not an assertion. `* text=auto eol=lf` was verified to reproduce the
      # fingerprint on clones at both core.autocrlf settings, but a CI checkout is a third
      # checkout with its own conventions and this project keeps finding that kind of
      # assumption wrong. If provenance fails, this output says immediately whether line
      # endings are why. A hard check here would be adding a gate, which this slice must not
      # do.
      - name: Line endings of the fingerprinted inputs (diagnostic)
        shell: bash
        run: |
          git config --get core.autocrlf || echo "core.autocrlf: (unset)"
          git ls-files --eol -- crates/worldbuilder-engine/src Cargo.toml Cargo.lock crates/worldbuilder-engine/Cargo.toml

      - name: Provenance -- does the shipped .wasm match the source in this commit?
        shell: bash
        working-directory: viewer
        run: npm run check:wasm

      # Two gates the plan's table does not list but the project's own "everything that must
      # be re-run" block in viewer/README.md does. They are the provenance chain's proofs that
      # it can refuse, and they need no browser and no person, so leaving them out would have
      # meant shipping a CI slice that omits the cheapest fail-proofs in the repository.
      #
      # `stale-self-test` copies the fingerprint inputs to a temp tree, edits one line there,
      # and confirms the real fingerprint function reports a different digest -- seconds, no
      # build, and it never touches crates/.
      #
      # `self-test` builds WITHOUT `--features wasm`, reproducing the historical 327-byte
      # memory-only artifact, and confirms the strict shape assertion rejects it; then it
      # rebuilds the real one. It works entirely in `target/` and never writes
      # viewer/public/wasm, so it cannot disturb the artifact the step above just vouched for.
      # It is placed AFTER the provenance check so nothing has compiled before that question
      # is asked.
      - name: Can the staleness fingerprint refuse a tree that moved?
        shell: bash
        working-directory: viewer
        run: npm run build:wasm:stale-self-test

      - name: Can the build-shape assertion reject an empty artifact?
        shell: bash
        working-directory: viewer
        run: npm run build:wasm:self-test

      - name: Parity -- native dump
        shell: bash
        working-directory: crates/worldbuilder-engine/parity
        run: cargo run --release -p worldbuilder-engine --example parity_dump --features wasm > native.txt

      # `tee` under `pipefail` so the harness's own exit status still decides the step while
      # its output is kept for the count assertion below.
      - name: Parity -- replay through the committed .wasm
        shell: bash
        working-directory: crates/worldbuilder-engine/parity
        run: |
          set -euo pipefail
          node parity.mjs native.txt 2>&1 | tee parity.out

      # THE COUNT GATE, parity half. `0 divergent` is only as strong as the number of values
      # it is zero out of. `examples/parity_dump.rs` was NOT a fingerprinted input until
      # 2026-09-04 -- run 33916847441 shrank the corpus by a sixth with provenance, parity
      # and `cargo test` all green, and this gate was the only thing that noticed. It is a
      # fingerprint input now, so provenance refuses too; the two are independent and both
      # are kept. 56,254 is the recorded population -- 53,251 from the Surface-level corpus
      # plus 3,003 from Task 5's erosion group (a 3,000-node capped `erode_to_convergence`
      # bake through `wb_erosion_run`, plus its status/iterations/converged trio; see
      # `examples/parity_dump.rs` for why 3,000 nodes exercises every arithmetic path a
      # planetary bake would, and slice 5a's task-5-report.md for why size does not matter to
      # a bit-equality claim).
      #
      # 2026-09-05, slice 5b Task 5: 56,254 -> 71,596. RE-DERIVED FROM THE CORPUS DEFINITION,
      # not read off the run, and the run was then checked against it:
      #
      #   56,254  everything above, unchanged
      #   +   22  `wb_relief_preset` itself: 2 selectors x (1 status + 10 f64)
      #   +5,000  `wb_elevation_m` on a world built from a NON-canonical relief block
      #   +5,000  `wb_structural_m` on the same world
      #   +4,225  one 65x65 `wb_fill_tile_f32` on it -- the path the viewer's tile workers
      #           actually take with a relief block attached to the spec
      #   +1,095  `wb_water_run`: 1 status + 1 body count + 1 datum + 156 bodies x 7 fields
      #   =71,596
      #
      # The relief entries close the gap relief Task 4 flagged itself: that slice changed the
      # export surface for the first time and parity had not been re-run against it. The water
      # entry closes a larger one -- `water.rs` was UNREACHABLE from the export surface, so its
      # native/WASM agreement was unfalsifiable rather than unverified, exactly as `erosion.rs`
      # was before `wb_erosion_run`.
      #
      # 156 bodies is a measured property of this world (seed 20260904, 30,000 nodes, datum
      # 0.0, `pond_max_surface_area_m2 = 1.0e5`), so this pin moves if the mesh or the seed
      # does -- which is the point: a corpus whose size nothing constrains can shrink silently.
      # ALL 156 ARE LAKES AND NONE IS A POND, and `examples/parity_dump.rs` asserts that
      # directly: slice 5b Task 3 calibrated the threshold on external ground and then measured
      # that this generator's smallest body is nearly four orders of magnitude larger. That is
      # a recorded finding about the mesh; a corpus that quietly "fixed" it by moving the
      # threshold would be hiding the finding rather than testing it.
      #
      # The script also checks the sixteen per-group tallies sum to the total, so a format
      # change fails loudly instead of matching nothing.
      - name: Assert the corpus -- 71,596 values, 0 divergent
        shell: bash
        working-directory: crates/worldbuilder-engine/parity
        run: |
          set -euo pipefail
          python "$GITHUB_WORKSPACE/.github/scripts/assert_counts.py" parity             --output parity.out --expect-label parity             --expect-compared 71596 --expect-divergent 0

      # The control. The harness's own documented proof that it can notice a wrong answer:
      # `--mutate seed` moves the world seed by one and 68,457 of 71,596 values diverge. A
      # parity run whose harness cannot fail is not evidence, and this is the cheapest place
      # in the project to keep proving that it can.
      #
      # 2026-09-05, slice 5b Task 5: 53,778 -> 68,457, and the arithmetic is stated rather
      # than adjusted. The three new groups add 14,679 divergent values (5,000 elevation and
      # 4,225 tile cells on the relief world move outright; 4,516 of its 5,000 structural
      # readings move, the residue being the same open-ocean floor that leaves 942 of the
      # `plain` world's structural readings equal; 938 of the water group's 1,095 move). The
      # 22 preset values do NOT move, and that is a property worth having in the tally rather
      # than a gap: `wb_relief_preset` hands back `detail.rs`'s own constants, which no world
      # seed can reach -- the same reason `version` has always sat at 0 divergent here.
      - name: Parity -- the control (a harness that cannot fail is not evidence)
        shell: bash
        working-directory: crates/worldbuilder-engine/parity
        run: |
          set -euo pipefail
          node parity.mjs native.txt --mutate seed 2>&1 | tee control.out

      # The control's own count. "the harness can be made to fail" is satisfied by ONE
      # divergent value; the recorded figure is 53,778 of 56,254, and a control that
      # collapsed to a handful would still exit 0 while proving far less than the record says
      # it proves.
      - name: Assert the control -- 68,457 of 71,596 divergent
        shell: bash
        working-directory: crates/worldbuilder-engine/parity
        run: |
          set -euo pipefail
          python "$GITHUB_WORKSPACE/.github/scripts/assert_counts.py" parity             --output control.out --expect-label "CONTROL (--mutate seed)"             --expect-compared 71596 --expect-divergent 68457

      # The second control, Task 5's own: `--mutate seed` proves the harness notices "an
      # entirely different planet" (95.6% of values move -- every group, gross). It does not
      # by itself prove the harness is sensitive to the erosion solver's own arithmetic
      # specifically, and a control that only ever diverges on everything is nearly as
      # uninformative as one that never diverges at all (task-5-brief.md). `--mutate
      # erosion-k` bumps `erodibility_per_yr` by exactly one ULP and touches nothing else --
      # only the `erosion/erosion` group can move. The corpus is built so both the native
      # run and this perturbed replay hit `max_iterations` without converging (see
      # `examples/parity_dump.rs`), so the two runs take the identical number of steps by
      # construction: a divergent height here is evidence of arithmetic sensitivity to `k`,
      # not of a different iteration count.
      - name: Parity -- the erosion control (a harness that cannot fail is not evidence)
        shell: bash
        working-directory: crates/worldbuilder-engine/parity
        run: |
          set -euo pipefail
          node parity.mjs native.txt --mutate erosion-k 2>&1 | tee erosion-control.out

      # The erosion control's own count: 216 of the erosion group's 3,000 heights move from
      # a single ULP on `k` (7.2%) -- status, iterations and converged are unaffected (fixed
      # step count, see above), and every non-erosion group is untouched (216 of 71,596
      # overall). Neither zero nor "every non-root node" -- a plausible fraction, which is
      # the property this control exists to demonstrate. The divergent count is UNCHANGED at
      # 216 across slice 5b Task 5's corpus growth, and that is the expected outcome: the
      # three groups Task 5 added are downstream of neither `k` nor erosion, so a control
      # whose count had moved with them would have been reaching something it does not name.
      - name: Assert the erosion control -- 216 of 71,596 divergent
        shell: bash
        working-directory: crates/worldbuilder-engine/parity
        run: |
          set -euo pipefail
          python "$GITHUB_WORKSPACE/.github/scripts/assert_counts.py" parity             --output erosion-control.out --expect-label "CONTROL (--mutate erosion-k)"             --expect-compared 71596 --expect-divergent 216

      # THE THIRD CONTROL, slice 5b Task 5's own, and the one with the sharpest claim.
      #
      # `--mutate seed` proves the harness notices an entirely different planet (95.6% of
      # values move -- gross, every group). `--mutate erosion-k` proves it notices one ULP in
      # one physical parameter of one export, at a fraction nobody can state in advance.
      # Neither touches the water path at all, so neither says anything about `water.rs` --
      # which is the module slice 5b built, and which no export reached until Task 5.
      #
      # `--mutate water-pond` replays the `W` record with `pond_max_surface_area_m2` moved from
      # Task 3's calibrated 1.0e5 m^2 to 2.0e10 m^2, and touches nothing else -- so only the
      # `water/plain` group can move. THE PREDICTION IS STATED BEFORE THE RUN AND CHECKED
      # AGAINST IT, which is what separates this from a gate adjusted to whatever appeared:
      #
      #   - `pond_max_surface_area_m2` reaches exactly ONE field, `Body::kind`
      #     (`water::classify_lake_kinds` compares it against a summed surface area and writes
      #     `LakeKind`). So `root_node`, `level_m`, all four extent bounds, the body count and
      #     the datum must ALL compare equal, on both sides, exactly as slice 5a's erosion
      #     control required its iteration count and convergence flag to.
      #   - How many `kind` fields move is predicted NATIVELY, from
      #     `water::lake_body_surface_areas_m2` -- the summed surface area per physical body,
      #     which is a different quantity from the classifier being perturbed. A body flips
      #     exactly when its area is at or below the threshold: 60 of 156.
      #     `examples/parity_dump.rs` asserts that the classifier agrees with the area
      #     distribution before writing the prediction into the corpus, so a disagreement fails
      #     there rather than being absorbed into a divergent count here.
      #   - `parity.mjs` then checks its own per-group tallies against that prediction and
      #     exits 1 if any group -- water or not -- moved by a different amount. The number
      #     below is therefore asserted twice, by two scripts, from two directions.
      #
      # 60 of 156 is deliberately neither none nor all: a control that moves everything is as
      # uninformative as one that moves nothing, and 2.0e10 m^2 sits near the median of this
      # mesh's measured body-surface distribution for that reason.
      - name: Parity -- the water control (one field of one export, and the count is predicted)
        shell: bash
        working-directory: crates/worldbuilder-engine/parity
        run: |
          set -euo pipefail
          node parity.mjs native.txt --mutate water-pond 2>&1 | tee water-control.out

      - name: Assert the water control -- 60 of 71,596 divergent, all of them `kind`
        shell: bash
        working-directory: crates/worldbuilder-engine/parity
        run: |
          set -euo pipefail
          python "$GITHUB_WORKSPACE/.github/scripts/assert_counts.py" parity             --output water-control.out --expect-label "CONTROL (--mutate water-pond)"             --expect-compared 71596 --expect-divergent 60
