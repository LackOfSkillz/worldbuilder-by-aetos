# TRIMMED, DELIBERATELY. Three proofs, one push. Nothing here changes what any gate
# asserts -- only which jobs run.
#
#   1. deleted-test   the Python count gate notices a test that stopped existing, while
#                     pytest itself exits 0. The deletion is done by a STEP rather than
#                     committed, so it cannot perturb job 2's numbers.
#   2. unguarded-skip the bug in its real form: WORLDBUILDER_REQUIRE_ENGINE unset, no
#                     engine built. pytest reports `240 passed, 1 skipped` and EXITS 0.
#                     150 conformance comparisons are gone and the count gate is the only
#                     thing that says so.
#   3. provenance     examples/parity_dump.rs edited (committed on this branch), artifact
#                     NOT rebuilt. Before 2026-09-04 this was green -- run 33916847441
#                     shrank the corpus this exact way and check:wasm said "matches the
#                     source that is here now". It is a fingerprint input now.
name: gates
on:
  push:
  workflow_dispatch:
env:
  RUST_VERSION: "1.98.0"
  PYTHON_VERSION: "3.11"
  CARGO_TERM_COLOR: always
jobs:
  deleted-test:
    name: python count gate -- a deleted test (pytest still exits 0)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Pin the Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
      - name: Create the virtualenv
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .venv
          echo "$PWD/.venv/Scripts" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
      - name: Install the test harness
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "maturin==1.15.0" pytest
      - name: Build the engine wheel
        shell: bash
        run: maturin develop --release --features python -m crates/worldbuilder-engine/Cargo.toml
      - name: THE BREAKAGE -- delete tests/test_geometry.py (23 tests)
        shell: bash
        run: rm tests/test_geometry.py
      - name: Collect the suite (one of the two counts)
        shell: bash
        env:
          WORLDBUILDER_REQUIRE_ENGINE: "1"
        run: |
          set -euo pipefail
          python -m pytest tests/ --collect-only -q 2>&1 | tee collect.out
      - name: pytest with the engine REQUIRED -- THIS STEP MUST PASS
        shell: bash
        env:
          WORLDBUILDER_REQUIRE_ENGINE: "1"
        run: |
          set -euo pipefail
          python -m pytest tests/ 2>&1 | tee pytest.out
      - name: Assert the suite -- must go RED at 367
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/assert_counts.py pytest \
            --collect collect.out --run pytest.out \
            --expect-total 390 --expect-file tests/test_conformance.py=150

  unguarded-skip:
    name: python count gate -- the silent skip (pytest exits 0, green, compares nothing)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install pytest only -- NO ENGINE IS BUILT
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install pytest
      # No WORLDBUILDER_REQUIRE_ENGINE anywhere below. This is the historical
      # configuration, exactly.
      - name: Collect the suite, unguarded
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest tests/ --collect-only -q 2>&1 | tee collect.out
      - name: pytest, unguarded -- THIS STEP MUST PASS, and that is the bug
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest tests/ 2>&1 | tee pytest.out
      - name: Assert the suite -- must go RED though pytest exited 0
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/assert_counts.py pytest \
            --collect collect.out --run pytest.out \
            --expect-total 390 --expect-file tests/test_conformance.py=150

  provenance:
    name: provenance -- examples/parity_dump.rs edited, artifact not rebuilt
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Pin the Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
          rustc -vV
      - name: Provenance -- must go RED, 28 inputs fingerprinted
        shell: bash
        working-directory: viewer
        run: npm run check:wasm
