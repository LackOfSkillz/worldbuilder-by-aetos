# THROWAWAY BRANCH (slice CI, task 2): the single most valuable red this task can produce.
#
# The Python conformance suite reported GREEN WHILE COMPARING NOTHING for a whole slice.
# tests/test_conformance.py line 29:
#
#     if os.environ.get("WORLDBUILDER_REQUIRE_ENGINE"):
#         import worldbuilder_engine as engine
#     else:
#         engine = pytest.importorskip(...)
#
# Nothing set that variable, so a missing engine took the second branch and every comparison
# was skipped. This file runs the SAME suite against the SAME missing engine twice -- once
# with the guard set and once without -- so both halves of that sentence are on the record.
#
# EXPECTED: `required` is RED and `unguarded` is GREEN. The green one is the bug.
#
# Neither job installs the engine. Neither installs Rust or maturin either: not building it
# is the whole experiment.

name: gates

on:
  push:
  workflow_dispatch:

jobs:
  required:
    name: conformance, engine missing, WORLDBUILDER_REQUIRE_ENGINE=1 (MUST FAIL)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - shell: bash
        run: python -m pip install --upgrade pip pytest
      - name: The engine is genuinely absent
        shell: bash
        run: |
          python -c "
          import importlib.util, sys
          spec = importlib.util.find_spec('worldbuilder_engine')
          print('worldbuilder_engine spec:', spec)
          sys.exit(1 if spec else 0)
          "
      # `-m` is load-bearing: it puts the working directory on sys.path so the pure-Python
      # reference package resolves from the tree, exactly as the real gate does.
      - name: pytest with the engine REQUIRED
        shell: bash
        env:
          WORLDBUILDER_REQUIRE_ENGINE: "1"
        run: python -m pytest tests/test_conformance.py

  unguarded:
    name: conformance, engine missing, guard UNSET (this green is the bug)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - shell: bash
        run: python -m pip install --upgrade pip pytest
      - name: pytest with no guard set -- the historical configuration
        shell: bash
        run: python -m pytest tests/test_conformance.py -rs
