      #     window is `|above_shore| <= window_spreads * spread` and that band is wide: an
      #     independent 0.5-degree global scan of this fixture finds 162,159 of 258,480 sites
      #     moving under `CoastParams::fractal()`. A tectonic belt is a line on the planet; a
      #     coastline's shelf is most of the interesting part of one.
      #
      #     The first cut of this corpus used a 2-degree box and a 1-degree tile, exactly as the
      #     tectonic control does, and BOTH moved 100% -- 2,000 of 2,000 and 4,225 of 4,225. The
      #     dump's own both-ends-refused guard caught that and refused to write the corpus, which
      #     is the guard doing what it exists for: a group that moves everything is as
      #     uninformative as one that moves nothing. The box is twenty degrees so it straddles the
      #     band.
      #
      #   STAYS EQUAL -- both `wb_coast_preset` groups, the `wb_coast_check` group, and every
      #     group of every world built without a coast block: the plain and harbour worlds, the
      #     relief world, BOTH tectonic worlds, erosion, water and version. That is 94,978 values
      #     that must not move, and it is the half that says the field reaches what it names and
      #     nothing else.
      #
      # The counts are computed NATIVELY in `examples/parity_dump.rs` and checked here, not read
      # off this run. They are derived twice on that side: once through the exports and once
      # through the library's own `Surface`, with the block read from `continentality.rs` rather
      # than from the six words that crossed the boundary -- so an `encode`/`decode` disagreement
      # parts the two counts and fails there.
      #
      # **No structural-containment claim is made, unlike the tectonic control's, and that is
      # deliberate**: `CoastParams` reaches `elevation_m` through `Continentality::base_elevation`
      # as well as through the shelf, so an elevation that moves without a structural moving is
      # expected here. Asserting the subset the warp satisfies would be asserting something false.
      - name: Parity -- the coast control (one word of the block, and the count is predicted)
        shell: bash
        working-directory: crates/worldbuilder-engine/parity
        run: |
          set -euo pipefail
          node parity.mjs native.txt --mutate coast-amplitude 2>&1 | tee coast-control.out

      # 2026-09-10, water 1a Task 12b: 148,707 -> 128,347 compared (the `hydro/plain` shrink,
      # Ruling 12b-2); 13,128 divergent is UNCHANGED -- this control never touched the hydro
      # channel.
      #
      # 2026-09-10, water 1a I6 (the ruling implemented): 128,347 -> 136,086 compared (+7,739,
      # the new `H ranges` record). 13,128 divergent is UNCHANGED -- `amplitude` reaches only a
      # world built from a coast block; neither tectonic world carries one, so `hydro/ranges`
      # (baked on the `ranges` tectonic world) sits at 0 beside `hydro/plain`.
      # 2026-09-11, water 1b-1 Task 7: 136,086 -> 132,472 compared (the hydro shrink); 13,128
      # divergent UNCHANGED -- `amplitude` still reaches no hydro record (neither tectonic
      # world carries a coast block).
      - name: Assert the coast control -- 13,128 of 132,472 divergent, all on the coast world
        shell: bash
        working-directory: crates/worldbuilder-engine/parity
        run: |
          set -euo pipefail
          python "$GITHUB_WORKSPACE/.github/scripts/assert_counts.py" parity             --output coast-control.out --expect-label "CONTROL (--mutate coast-amplitude)"             --expect-compared 132472 --expect-divergent 13128

      # THE SIXTH CONTROL (the gully slice). `--mutate gully-steer` replays the two `worldg`
      # records with word 9, `steer_lattice_m`, moved from the shipped 2,000 m to 500 m -- a
      # value INSIDE the domain rather than outside it, because the point of this control is
      # that a plausible number a host could send moves the ground, not that a refused one
      # does. It touches nothing else. The prediction is stated before the run, per group:
      #
      #   MOVES -- 1,235 of 5,000 scattered elevations; 993 of 2,000 in a 20-degree box on the
      #     flank belt; 962 of 4,225 cells of a tile across the same box. 3,190 in total.
      #
      #     **24.7% of a uniform global scatter is the right shape here.** The gate is
      #     `smooth((structural - 200) / 900)`, and 29.15% of this world is land whose median
      #     is 441 m -- so about a quarter of a global scatter is gated ground, and the rest is
      #     sea and shore where the kernel does not run at all.
      #
      #     The first cut of the box was four degrees, exactly as the tectonic control's is
      #     two, and it moved 2,000 of 2,000: a four-degree box on this witness sits entirely
      #     inside the landmass. The dump's own both-ends-refused guard caught it and refused
      #     to write the corpus, which is the second time that guard has done this job.
      #
      #   STAYS EQUAL -- both `wb_gully_preset` groups, the `wb_gully_check` group, every group
      #     of every world built without a gully block, and **every `wb_structural_m` value in
      #     the gully world itself**, which is 0 of 5,000 and 0 of 2,000.
      #
      # **THOSE TWO ZEROS ARE THE CLAIM, NOT AN ABSENCE OF EVIDENCE**, and this is the one
      # control in the file whose predicted zeros are load-bearing. The gully term is DETAIL,
      # and `structural_m` is the very signal its steering lattice reads
      # (`.superpowers/sdd/notes/gradient-probe.md` section 2.4: a term inside `elevation_m`
      # steering on `grad(elevation_m)` steers on itself). A structural value that moved here
      # would mean the term had escaped its layer and was feeding its own input -- and that
      # substitution, tried as a mutation on the Rust side, DOES NOT TERMINATE.
      #
      # The counts are computed NATIVELY in `examples/parity_dump.rs` and checked here, not
      # read off this run, and they are derived twice on that side: once through the exports
      # and once through the library's own `Surface`, with the block read from `detail.rs`
      # rather than from the ten words that crossed the boundary.
      - name: Parity -- the gully control (one word of the block, and the count is predicted)
        shell: bash
        working-directory: crates/worldbuilder-engine/parity
        run: |
          set -euo pipefail
          node parity.mjs native.txt --mutate gully-steer 2>&1 | tee gully-control.out

      # 2026-09-10, water 1a Task 12b: 148,707 -> 128,347 compared (the `hydro/plain` shrink,
      # Ruling 12b-2); 3,752 divergent is UNCHANGED -- this control never touched the hydro
      # channel.
      #
      # 2026-09-10, water 1a I6 (the ruling implemented): 128,347 -> 136,086 compared (+7,739,
      # the new `H ranges` record). 3,752 divergent is UNCHANGED -- `steer_lattice_m` reaches
      # only a world built from a gully block; neither tectonic world carries one, so
      # `hydro/ranges` sits at 0 beside `hydro/plain`.
      # 2026-09-11, water 1b-1 Task 7: 136,086 -> 132,472 compared (the hydro shrink); 3,752
      # divergent UNCHANGED -- `steer_lattice_m` still reaches no hydro record.
      - name: Assert the gully control -- 3,752 of 132,472 divergent, none of them structural
        shell: bash
        working-directory: crates/worldbuilder-engine/parity
        run: |
          set -euo pipefail
          python "$GITHUB_WORKSPACE/.github/scripts/assert_counts.py" parity \
            --output gully-control.out --expect-label "CONTROL (--mutate gully-steer)" \
            --expect-compared 132472 --expect-divergent 3752

      # THE SEVENTH CONTROL (the climate slice). `--mutate climate-samples` adds ONE upwind step
      # to every `CL` and `CK` record and touches nothing else. It is a control with a shape
      # rather than a size, and the shape is the informative half: one more step changes the
      # rain-out integral, and it cannot change `climate::temperature_c` (a closed form in
      # latitude with no march in it), a quantile of elevation, a land count or a lapse rate. So
      # every `climate-moist/*` group must move and every `climate-temp/*`, every
      # `climate-land/*` and every group of every other channel must sit at exactly zero --
      # which `parity.mjs` asserts itself, not merely reports.
      - name: Parity -- the climate control (one more upwind step, and the shape is predicted)
        shell: bash
        working-directory: crates/worldbuilder-engine/parity
        run: |
          set -euo pipefail
          node parity.mjs native.txt --mutate climate-samples 2>&1 | tee climate-control.out

      # 2026-09-10, water 1a Task 12b: 148,707 -> 128,347 compared (the `hydro/plain` shrink,
      # Ruling 12b-2); 648 divergent is UNCHANGED -- this control never touched the hydro
      # channel.
      #
      # 2026-09-10, water 1a I6 (the ruling implemented): 128,347 -> 136,086 compared (+7,739,
      # the new `H ranges` record). 648 divergent is UNCHANGED -- an upwind step reaches only
      # `climate-moist/*`; both `hydro/plain` and `hydro/ranges` sit at 0, which `parity.mjs`'s
      # own climate-control check now requires of `hydro/ranges` as strictly as of any other
      # non-moisture group.
      # 2026-09-11, water 1b-1 Task 7: 136,086 -> 132,472 compared (the hydro shrink); 648
      # divergent UNCHANGED -- an upwind step still reaches only `climate-moist/*`.
      - name: Assert the climate control -- 648 of 132,472 divergent, every one of them moisture
        shell: bash
        working-directory: crates/worldbuilder-engine/parity
        run: |
          set -euo pipefail
          python "$GITHUB_WORKSPACE/.github/scripts/assert_counts.py" parity \
            --output climate-control.out --expect-label "CONTROL (--mutate climate-samples)" \
            --expect-compared 132472 --expect-divergent 648
