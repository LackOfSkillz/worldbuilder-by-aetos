# THROWAWAY BRANCH (slice CI, task 2). Two deliberate breakages, three reds:
#
#   1. viewer/public/wasm/worldbuilder_engine.wasm has ONE BYTE flipped (offset 40000).
#      The shipped bytes are no longer the bytes MANIFEST.txt describes.
#        -> `npm run check:wasm` must say so.
#        -> `parity.mjs` must REFUSE rather than report "0 divergent".
#      parity is handed an EMPTY native.txt on purpose: the provenance gate runs before the
#      dump is read, so this proves the refusal without a four-minute release build.
#
#   2. assertArtifact()'s strict block in build-wasm.mjs is disabled (`if (false && ...)`).
#        -> `npm run build:wasm:self-test` builds the 327-byte feature-less artifact, the
#           weakened assertion accepts it, and the SELF-TEST must fail.
#      That edit does not touch the staleness fingerprint (build-wasm.mjs is not one of its
#      inputs), so job 1 and job 2 still fail for their own reason and not for this one.

name: gates

on:
  push:
  workflow_dispatch:

env:
  RUST_VERSION: "1.98.0"

jobs:
  provenance:
    name: check-wasm on a mutated artifact (MUST FAIL)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
      - name: Provenance
        shell: bash
        working-directory: viewer
        run: npm run check:wasm

  parity-refusal:
    name: parity must refuse a mutated artifact (MUST FAIL)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
      - name: Parity against an empty dump -- provenance is checked first
        shell: bash
        working-directory: crates/worldbuilder-engine/parity
        run: |
          : > native.txt
          node parity.mjs native.txt

  shape-self-test:
    name: build-shape self-test with the assertion sabotaged (MUST FAIL)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
          rustup target add wasm32-unknown-unknown
      - name: Can the build-shape assertion reject an empty artifact?
        shell: bash
        working-directory: viewer
        run: npm run build:wasm:self-test
