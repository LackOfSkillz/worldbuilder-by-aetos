[flake8]
max-line-length = 92
# E203 is the slice-colon rule black disagrees with; black wins.
extend-ignore = E203
exclude = .git,__pycache__,.pytest_cache,build,dist
# The engine argues with itself in comments, at length and deliberately, because most of
# what it does is a choice between smooth things that could each have been made badly.
max-complexity = 12
